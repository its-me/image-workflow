name: Chain release
run-name: ${{ github.workflow }} ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.2.3)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REPOSITORY: workflow

jobs:
  resolve-version:
    name: Resolve version and platforms
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      is_latest: ${{ steps.version.outputs.is_latest }}
      base_matrix: ${{ steps.platforms.outputs.base_matrix }}
    steps:
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_TAG#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Invalid version: $version"
            exit 1
          fi
          # Compare against upstream stable releases rather than this repo's tags:
          # several releases can run concurrently and tags are only created once
          # a release succeeds.
          highest=$(gh api repos/its-me/dummy.releases/releases --paginate --jq '.[] | select((.draft or .prerelease) | not) | .tag_name | select(test("^v[0-9]+(\\.[0-9]+)*$")) | ltrimstr("v")' | sort -V | tail -1)
          if [ -z "$highest" ] || [ "$(printf '%s\n%s\n' "$highest" "$version" | sort -V | tail -1)" = "$version" ]; then
            echo "is_latest=true" >> $GITHUB_OUTPUT
          else
            echo "is_latest=false" >> $GITHUB_OUTPUT
          fi
          echo "value=$version" >> $GITHUB_OUTPUT

      # busybox:latest's published platforms can shift over time, so the
      # matrix is resolved from the upstream manifest instead of hardcoded.
      # Both chain links reuse this same matrix rather than re-inspecting
      # their own (internally-published) parent image, since their platform
      # coverage can never exceed what the base link itself was built for.
      - name: Resolve platforms
        id: platforms
        run: |
          set -eu
          known='[
            {"platform":"linux/amd64",   "runner":"ubuntu-latest",    "qemu":false, "arch":"amd64",   "variant":null},
            {"platform":"linux/arm64",   "runner":"ubuntu-24.04-arm", "qemu":false, "arch":"arm64",   "variant":"v8"},
            {"platform":"linux/arm/v7",  "runner":"ubuntu-24.04-arm", "qemu":true,  "arch":"arm",     "variant":"v7"},
            {"platform":"linux/arm/v6",  "runner":"ubuntu-24.04-arm", "qemu":true,  "arch":"arm",     "variant":"v6"},
            {"platform":"linux/386",     "runner":"ubuntu-latest",    "qemu":true,  "arch":"386",     "variant":null},
            {"platform":"linux/ppc64le", "runner":"ubuntu-latest",    "qemu":true,  "arch":"ppc64le", "variant":null},
            {"platform":"linux/s390x",   "runner":"ubuntu-latest",    "qemu":true,  "arch":"s390x",   "variant":null},
            {"platform":"linux/riscv64", "runner":"ubuntu-latest",    "qemu":true,  "arch":"riscv64", "variant":null}
          ]'

          available=$(docker buildx imagetools inspect "busybox:latest" --raw \
            | jq -c '[.manifests[].platform | select(.os == "linux") | {arch: .architecture, variant: (.variant // null)}]')

          matrix=$(jq -nc --argjson known "$known" --argjson avail "$available" \
            '{include: [$known[] | select(. as $k | $avail | any(.arch == $k.arch and .variant == $k.variant)) | {platform, runner, qemu}]}')

          echo "base_matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-link-1:
    name: Build link 1 (${{ matrix.platform }})
    needs: resolve-version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-version.outputs.base_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.chain-link-1
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ needs.resolve-version.outputs.version }}
          outputs: type=image,name=ghcr.io/its-me/${{ env.REPOSITORY }},push-by-digest=true,name-canonical=true,push=true

      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> $GITHUB_ENV

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: chain-link-1-digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  assemble-link-1:
    name: Assemble link 1 in GHCR
    needs: [resolve-version, build-link-1]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.tags.outputs.list }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: chain-link-1-digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Resolve tags
        id: tags
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          IS_LATEST: ${{ needs.resolve-version.outputs.is_latest }}
        run: |
          tags="chain-link-1-$VERSION"
          if [ "$IS_LATEST" = "true" ]; then
            tags="$tags chain-link-1"
          fi
          echo "list=$tags" >> $GITHUB_OUTPUT

      - name: Create manifest
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          for tag in $TAGS; do
            docker buildx imagetools create \
              --tag ghcr.io/its-me/$REPOSITORY:$tag \
              $(printf "ghcr.io/its-me/$REPOSITORY@sha256:%s " $(ls /tmp/digests))
          done

  push-link-1-hub:
    name: Deploy link 1 to Docker Hub
    needs: assemble-link-1
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/${{ env.REPOSITORY }}
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: ${{ secrets.HUB_USERNAME }}/${{ env.REPOSITORY }}
          destination-username: ${{ secrets.HUB_USERNAME }}
          destination-password: ${{ secrets.HUB_TOKEN }}
          tags: ${{ needs.assemble-link-1.outputs.tags }}

  push-link-1-quay:
    name: Deploy link 1 to Quay.io
    needs: assemble-link-1
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - name: Resolve Quay namespace
        id: namespace
        env:
          QUAY_NAMESPACE: ${{ secrets.QUAY_USERNAME }}
        run: echo "value=${QUAY_NAMESPACE%%+*}" >> "$GITHUB_OUTPUT"

      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/${{ env.REPOSITORY }}
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: quay.io/${{ steps.namespace.outputs.value }}/${{ env.REPOSITORY }}
          destination-username: ${{ secrets.QUAY_USERNAME }}
          destination-password: ${{ secrets.QUAY_TOKEN }}
          tags: ${{ needs.assemble-link-1.outputs.tags }}

  build-link-2:
    name: Build link 2 (${{ matrix.platform }})
    needs: [resolve-version, assemble-link-1]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-version.outputs.base_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.chain-link-2
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ needs.resolve-version.outputs.version }}
          outputs: type=image,name=ghcr.io/its-me/${{ env.REPOSITORY }},push-by-digest=true,name-canonical=true,push=true

      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> $GITHUB_ENV

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: chain-link-2-digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  assemble-link-2:
    name: Assemble link 2 in GHCR
    needs: [resolve-version, build-link-2]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.tags.outputs.list }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: chain-link-2-digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Resolve tags
        id: tags
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          IS_LATEST: ${{ needs.resolve-version.outputs.is_latest }}
        run: |
          tags="chain-link-2-$VERSION"
          if [ "$IS_LATEST" = "true" ]; then
            tags="$tags chain-link-2"
          fi
          echo "list=$tags" >> $GITHUB_OUTPUT

      - name: Create manifest
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          for tag in $TAGS; do
            docker buildx imagetools create \
              --tag ghcr.io/its-me/$REPOSITORY:$tag \
              $(printf "ghcr.io/its-me/$REPOSITORY@sha256:%s " $(ls /tmp/digests))
          done

  push-link-2-hub:
    name: Deploy link 2 to Docker Hub
    needs: assemble-link-2
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/${{ env.REPOSITORY }}
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: ${{ secrets.HUB_USERNAME }}/${{ env.REPOSITORY }}
          destination-username: ${{ secrets.HUB_USERNAME }}
          destination-password: ${{ secrets.HUB_TOKEN }}
          tags: ${{ needs.assemble-link-2.outputs.tags }}

  push-link-2-quay:
    name: Deploy link 2 to Quay.io
    needs: assemble-link-2
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - name: Resolve Quay namespace
        id: namespace
        env:
          QUAY_NAMESPACE: ${{ secrets.QUAY_USERNAME }}
        run: echo "value=${QUAY_NAMESPACE%%+*}" >> "$GITHUB_OUTPUT"

      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/${{ env.REPOSITORY }}
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: quay.io/${{ steps.namespace.outputs.value }}/${{ env.REPOSITORY }}
          destination-username: ${{ secrets.QUAY_USERNAME }}
          destination-password: ${{ secrets.QUAY_TOKEN }}
          tags: ${{ needs.assemble-link-2.outputs.tags }}
