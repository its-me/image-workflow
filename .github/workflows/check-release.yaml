name: Check for new release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Check for missed releases
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: write
    steps:
      # Dispatches all build workflows for every stable upstream release that
      # has no tag in this repository yet. Only versions at or above the oldest
      # existing tag are considered, so ancient upstream history is not built.
      # workflow.yaml creates the repository tag once it succeeds, so a failed
      # release is retried on the next run.
      - name: Dispatch missed releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$GH_REPO/tags" --paginate --jq '.[].name')
          upstream=$(gh api repos/its-me/dummy.releases/releases --paginate \
            --jq '.[] | select((.draft or .prerelease) | not) | .tag_name' \
            | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V || true)
          floor=$(grep -E '^v[0-9]+(\.[0-9]+)*$' <<<"$existing" | sort -V | head -1 || true)

          if [ -z "$floor" ]; then
            upstream=$(tail -1 <<<"$upstream")
          fi

          for tag in $upstream; do
            if [ -n "$floor" ] && [ "$(printf '%s\n%s\n' "$floor" "$tag" | sort -V | head -1)" != "$floor" ]; then
              continue
            fi
            if grep -qxF "$tag" <<<"$existing"; then
              continue
            fi
            echo "Dispatching release for $tag"
            gh workflow run workflow.yaml -f tag="$tag"
            gh workflow run chain.yaml -f tag="$tag"
            gh workflow run simple.yaml -f tag="$tag"
          done
